schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
context: |
  Tech stack: TypeScript, Phaser 4, Matter.js
  Domain: local multiplayer party game (bumper cars × billiard)
  Architecture: monorepo with npm workspaces (packages/engine/, packages/client/)
  Engine: pure TypeScript, zero DOM, shared client+server via IPhysicsEngine interface
  Language: TypeScript throughout (no JS)
  Tests: Vitest in engine package (no browser/DOM needed)
  Phaser skills available at .opencode/skills/phaser/<name>/SKILL.md
  Map format: JSON files parsed by pure function (no I/O in parser)
  Input: AZERTY keyboard (ZQSD + Arrow keys) + gamepads (up to 4 players, 2+2)

