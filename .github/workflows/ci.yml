name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci

      # Biome : vérification format + lint (recommended)
      - run: npx @biomejs/biome ci

      # Client : build complet (tsc + vite build) → type-check + bundle
      - run: npm run -w packages/client build

      # Engine : testé via vitest (aucun build nécessaire, source-only)
      - run: npm -w packages/engine test
